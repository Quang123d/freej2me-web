<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>J2ME Deck</title>
<style>
:root{--bg:#f4f1ff;--card:#fff;--line:#e3dcff;--tx:#1b1535;--mut:#7a7399;--ac:#6d28d9;--ac2:#db2777;--on:#fff;--ok:#16a34a;--bad:#dc2626;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d0b1a;--card:#171430;--line:#2a2552;--tx:#efeaff;--mut:#8f88b8;--ac:#b6ff3b;--ac2:#ff4fd8;--on:#0d0b1a;--ok:#4ade80;--bad:#ff5c7a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d0b1a;--card:#171430;--line:#2a2552;--tx:#efeaff;--mut:#8f88b8;--ac:#b6ff3b;--ac2:#ff4fd8;--on:#0d0b1a;--ok:#4ade80;--bad:#ff5c7a;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;padding-bottom:40px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
.wrap{max-width:900px;margin:auto;padding:0 14px}
.top{display:flex;align-items:center;justify-content:space-between;padding:16px 2px 12px}
.logo{font-weight:800;letter-spacing:.14em;font-size:18px}
.logo i{font-style:normal;color:var(--ac)}
.rt{display:flex;align-items:center;gap:8px}
.badge{background:var(--card);border:1px solid var(--line);border-radius:99px;padding:6px 12px;font-size:13px;color:var(--mut)}
.badge b{color:var(--ac)}
.addb{height:40px;padding:0 16px 0 12px;border-radius:99px;background:linear-gradient(135deg,var(--ac),var(--ac2));color:var(--on);font-weight:800;display:flex;align-items:center;gap:6px}
.addb svg{stroke-width:3}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:700px){.grid{grid-template-columns:repeat(3,1fr)}}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;overflow:hidden}
.hd{display:flex;align-items:center;gap:8px;padding:10px 6px 8px 12px}
.led{width:9px;height:9px;border-radius:50%;background:var(--bad);flex:none}
.on .led{background:var(--ok);box-shadow:0 0 8px var(--ok)}
.hd span{flex:1;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ib{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;color:var(--mut)}
.ib:active{background:var(--line)}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.scr{position:relative;margin:0 10px;border-radius:12px;overflow:hidden;background:#000;aspect-ratio:3/3.3}
.fr{position:absolute;left:0;top:0;width:360px;height:640px;border:0;transform-origin:0 0;transform:scale(var(--s,.45))}
.tap{position:absolute;inset:0;z-index:2}
.ft{display:flex;align-items:center;justify-content:space-between;padding:6px 6px 8px 12px}
.pp{color:var(--ac)}
.hint{font-size:13px;color:var(--mut)}
.card.full{position:fixed;inset:0;z-index:50;border-radius:0;border:0;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.card.full .scr{flex:1;margin:0;border-radius:0;aspect-ratio:auto}
.card.full .fr{width:100%;height:100%;transform:none}
.card.full .tap{display:none}
.empty{grid-column:1/-1;text-align:center;color:var(--mut);padding:50px 20px;line-height:1.7;border:2px dashed var(--line);border-radius:22px}
.shade{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;z-index:40;align-items:flex-end}
.shade.on{display:flex}
.sheet{background:var(--card);width:100%;max-width:560px;margin:auto;border-radius:24px 24px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:80vh;overflow:auto}
.sheet h3{margin:0 0 10px}
.row{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:11px 12px;border-radius:14px;border:1px solid var(--line);margin-bottom:8px}
.row:active{background:var(--line)}
.row img{width:32px;height:32px;image-rendering:pixelated}
.row.new{border-style:dashed;color:var(--ac);font-weight:700}
#mgr{position:fixed;left:0;top:0;width:1px;height:1px;opacity:0;pointer-events:none;border:0}
#mgr.show{inset:0;width:100%;height:100%;opacity:1;pointer-events:auto;z-index:60;background:#eee;padding-top:56px}
#mgrbar{display:none;position:fixed;top:0;left:0;right:0;height:56px;z-index:61;background:var(--card);align-items:center;justify-content:space-between;padding:env(safe-area-inset-top,0px) 14px 0}
#mgrbar.on{display:flex}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><div class="logo">J2ME<i>/</i>DECK</div>
    <div class="rt"><div class="badge"><b id="cnt">0</b> tab</div>
      <button class="addb" id="add"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Thêm tab</button></div></div>
  <main class="grid" id="grid"></main>
</div>
<div class="shade" id="shade"><div class="sheet"><h3>Chọn game cho tab mới</h3><div id="list"></div></div></div>
<div id="mgrbar"><b>Thêm / quản lý game</b><button class="addb" id="done">Xong</button></div>
<script>
const $=s=>document.querySelector(s),grid=$('#grid'),tabs=[];
let games=[],ready=false,mgr=null;
const IC={x:'<svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>',
fs:'<svg class="i" viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>',
sm:'<svg class="i" viewBox="0 0 24 24"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg>',
stop:'<svg class="i" viewBox="0 0 24 24" style="fill:currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>',
play:'<svg class="i" viewBox="0 0 24 24" style="fill:currentColor"><path d="M7 5l12 7-12 7z"/></svg>'};
const runUrl=id=>'run?app='+encodeURIComponent(id)+'&mobile=1';

/* ===== Đọc danh sách game từ trang cài game (cùng địa chỉ web) ===== */
function openMgr(show){
  if(!mgr){mgr=document.createElement('iframe');mgr.id='mgr';mgr.src='./';document.body.appendChild(mgr)}
  mgr.classList.toggle('show',show);$('#mgrbar').classList.toggle('on',show);
}
function readList(){
  try{const d=mgr.contentDocument;if(!d||!d.getElementById('main')||d.getElementById('main').style.display==='none')return null;
    return [...d.querySelectorAll('#game-list .game-item a')].map(a=>{
      const m=(a.getAttribute('href')||'').match(/app=([^&]+)/);if(!m)return null;
      const i=a.querySelector('img.icon');
      return {id:decodeURIComponent(m[1]),name:a.querySelector('.game-info').textContent,icon:i?i.src:''}}).filter(Boolean)
  }catch(e){return null}
}
function closeMgr(){if(mgr){mgr.src='about:blank';mgr.remove();mgr=null}$('#mgrbar').classList.remove('on')}
async function loadGames(){
  ready=false;renderList();openMgr(false);
  for(let i=0;i<180&&mgr;i++){const l=readList();if(l){games=l;ready=true;break}await new Promise(r=>setTimeout(r,500))}
  if(!$('#mgrbar').classList.contains('on'))closeMgr();
  renderList();
}

/* ===== Thẻ game ===== */
function addTab(g){
  const t={name:g.name,id:g.id,running:true};
  const el=document.createElement('div');el.className='card on';
  el.innerHTML=`<div class="hd"><i class="led"></i><span></span><button class="ib" data-a="close" aria-label="Xóa tab">${IC.x}</button></div>
  <div class="scr"><iframe class="fr" allow="fullscreen; autoplay; gamepad"></iframe><div class="tap" data-a="full"></div></div>
  <div class="ft"><div class="hint">Chạm vào màn hình để mở rộng</div><div style="display:flex"><button class="ib pp" data-a="toggle" aria-label="Dừng hoặc chạy"></button><button class="ib" data-a="full" aria-label="Toàn màn hình"></button></div></div>`;
  el.querySelector('span').textContent=t.name;
  t.el=el;t.f=el.querySelector('iframe');t.scr=el.querySelector('.scr');
  t.f.src=runUrl(t.id);
  new ResizeObserver(()=>t.scr.style.setProperty('--s',t.scr.clientWidth/360)).observe(t.scr);
  el.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b)act(t,b.dataset.a)});
  tabs.push(t);grid.appendChild(el);sync(t);refresh();
}
function sync(t){t.el.classList.toggle('on',t.running);
  t.el.querySelector('[data-a=toggle]').innerHTML=t.running?IC.stop:IC.play;
  t.el.querySelector('.ft [data-a=full]').innerHTML=t.el.classList.contains('full')?IC.sm:IC.fs}
function act(t,a){
  if(a==='close'){t.f.src='about:blank';t.el.remove();tabs.splice(tabs.indexOf(t),1);refresh()}
  else if(a==='toggle'){t.running=!t.running;t.f.src=t.running?runUrl(t.id):'about:blank';sync(t)}
  else if(a==='full'){t.el.classList.toggle('full');document.body.style.overflow=t.el.classList.contains('full')?'hidden':'';sync(t)}
}
function refresh(){
  $('#cnt').textContent=tabs.length;let e=$('.empty');
  if(!tabs.length&&!e){e=document.createElement('div');e.className='empty';e.innerHTML='Chưa có tab nào.<br>Bấm <b>Thêm tab</b> để chạy một game';grid.appendChild(e)}
  else if(tabs.length&&e)e.remove();
}

/* ===== Bảng chọn game ===== */
function renderList(){
  const l=$('#list');l.innerHTML='';
  if(!ready){const p=document.createElement('div');p.className='hint';p.style.padding='6px 2px 12px';p.textContent='Đang tải danh sách game...';l.appendChild(p)}
  else if(!games.length){const p=document.createElement('div');p.className='hint';p.style.padding='6px 2px 12px';p.textContent='Chưa có game nào, hãy thêm file .jar.';l.appendChild(p)}
  games.forEach(g=>{const b=document.createElement('button');b.className='row';
    if(g.icon){const i=document.createElement('img');i.src=g.icon;i.alt='';b.appendChild(i)}
    b.appendChild(document.createTextNode(g.name));
    b.onclick=()=>{$('#shade').classList.remove('on');addTab(g)};l.appendChild(b)});
  const n=document.createElement('button');n.className='row new';n.textContent='+  Thêm / quản lý game .jar';
  n.onclick=()=>{$('#shade').classList.remove('on');closeMgr();openMgr(true)};l.appendChild(n);
}
$('#add').onclick=()=>{renderList();$('#shade').classList.add('on')};
$('#shade').onclick=e=>{if(e.target.id==='shade')$('#shade').classList.remove('on')};
$('#done').onclick=()=>{const l=readList();if(l){games=l;ready=true}closeMgr();renderList();$('#shade').classList.add('on')};
refresh();loadGames();
</script>
</body>
</html>
